    framework: "SwiftUI + SceneKit/RealityKit"
  windows:
    framework: "WinUI 3 + Win2D/SharpDX"

autonomy_level: "maxima"
execution_permissions:
  - bash_npm_node
  - bash_python_pip
  - bash_xcodebuild_swift
  - bash_dotnet
  - playwright_screenshot
  - xcode_preview
  - write_read_edit_output

portability_rule: "GATED — ports nativos NUNCA são escritos sem aprovação explícita do usuário em checkpoint dedicado"

checkpoint_tone: "consultivo — Arquiteto recomenda com justificativa antes de perguntar"

