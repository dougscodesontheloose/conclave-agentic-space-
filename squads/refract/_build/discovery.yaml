squad_code: refract
purpose: "Estúdio de engenharia cross-platform sob demanda. Recebe qualquer tarefa de dev, implementa em stack web (PWA), e traduz com fidelidade visual para macOS e Windows quando aprovado."
domain: mixed

company:
  name: "<user_name> de Paula Moura (<user_name>)"
  tone: "Técnico e narrativo. Direto, sem jargão desnecessário."

language: "pt-BR"

operating_mode: "time-pool-por-demanda + pipeline-portabilidade + laboratorio-3d"

